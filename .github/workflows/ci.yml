name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with coverage
        env:
          # The full test suite mocks every external call (OpenAI, yfinance,
          # Alpha Vantage, Chroma, MCP), so these do not need to be real
          # keys — they only need to exist so config.settings.validate()
          # (if invoked anywhere) doesn't fail on a missing variable.
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          ALPHA_VANTAGE_API_KEY: ci-placeholder-not-a-real-key
          VECTOR_BACKEND: chroma
          CHROMA_PERSIST_DIR: ./chroma_db
        run: pytest

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14
